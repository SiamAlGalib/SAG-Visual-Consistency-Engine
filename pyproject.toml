[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sag-visual-consistency-engine"
version = "0.1.0"
description = "A provider-neutral visual bible and scene prompt toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sag-vce = "sag_vce.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
